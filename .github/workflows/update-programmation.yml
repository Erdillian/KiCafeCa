name: Mise a jour programmation

on:
  schedule:
    - cron: '0 8 * * *'        # 8h UTC tous les jours
  workflow_dispatch:           # Lancement manuel depuis l'interface GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lancer le script de mise a jour
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'kimi-k2.6:cloud' }}
          USE_OLLAMA: ${{ secrets.USE_OLLAMA || 'true' }}
        run: python scripts/update_programmation.py

      - name: Commit & push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet programmation.html; then
            echo "Aucun changement dans programmation.html"
            exit 0
          fi
          git add programmation.html
          git commit -m "Maj auto programmation.html depuis Google Doc"
          git push
